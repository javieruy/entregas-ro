<!doctype html><html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Ocolul Lumii</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#0b3c5d,#0f5a73 55%,#1b7a8c);color:#fff;min-height:100vh}
.app{max-width:760px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:clamp(28px,6vw,44px);margin:6px 0 8px;letter-spacing:-.5px}h1 span{color:#ffd23f}
.lema{color:#cfe8ef;font-size:17px;line-height:1.45;margin:0 0 20px}
.btn{display:inline-block;border:0;border-radius:999px;background:linear-gradient(90deg,#ff7a1a,#ff4f2e);color:#fff;font-weight:800;font-size:18px;padding:15px 28px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.btn.gris{background:#ffffff22;box-shadow:none}.tarjeta .btn.gris{background:#e9edf3;color:#1b2a4a}
.pas{background:#fff;color:#1b2a4a;border-radius:18px;padding:16px;margin:0 0 18px}
.pas h2{margin:0 0 10px;font-size:18px}.sellos{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sello{aspect-ratio:1;border-radius:50%;border:2.5px dashed #c8cfdc;display:flex;align-items:center;justify-content:center;font-size:26px;opacity:.35}
.sello.ok{opacity:1;border-style:solid;transform:rotate(-8deg)}
.mapa{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cont{border:0;border-radius:16px;padding:18px 8px;color:#fff;font-weight:800;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 14px rgba(0,0,0,.22)}
.cont b{font-size:38px}.cont small{font-weight:600;opacity:.9}
.tarjeta{background:#fff;color:#1b2a4a;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.cat{display:inline-block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:4px 10px;border-radius:999px;color:#fff;margin-bottom:8px}
.num{float:right;color:#8a93a5;font-size:13px;font-weight:700}
.q{font-size:21px;font-weight:800;line-height:1.3;margin:6px 0 16px}
.ops{display:grid;gap:10px}.op{border:2px solid #e2e6ee;background:#f7f9fc;border-radius:14px;padding:14px;font-size:17px;font-weight:700;text-align:left;cursor:pointer;color:#1b2a4a}
.op.bien{background:#dff6e5;border-color:#2fa84f}.op.mal{background:#fde2e0;border-color:#e0453a}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fff6e1;font-size:16px;line-height:1.4;display:none}
.fb b{display:block;margin-bottom:4px}.acc{margin-top:16px;text-align:right}
.res{text-align:center}.res .big{font-size:64px}.oculto{display:none}
@media (max-width:520px){.mapa{grid-template-columns:repeat(2,1fr)}.sellos{grid-template-columns:repeat(6,1fr);gap:5px}.sello{font-size:20px}}
</style></head><body><div class="app" id="app"></div>
<script>
const D={"ui": {"titulo": "Ocolul Lumii", "lema": "Zboară de pe un continent pe altul, răspunde la întrebări și umple-ți pașaportul cu ștampile.", "jugar": "Pornește în călătorie", "pasaporte": "Pașaportul meu", "elige": "Alege următoarea destinație", "pregunta": "Întrebarea {n} din {t}", "correcto": "Corect!", "incorrecto": "Nu chiar. Răspunsul corect este:", "siguiente": "Mai departe", "sello": "Ai câștigat ștampila!", "sello_falta": "Ai nevoie de {n} răspunsuri corecte din {t} ca să câștigi ștampila. Mai încearcă o dată acest continent!", "reintentar": "Încearcă din nou", "volver": "Înapoi la hartă", "puntos": "{n} / {t} răspunsuri corecte", "final_titulo": "Mare călător!", "final_texto": "Ai strâns toate cele 6 ștampile. Pașaportul tău e plin: cunoști lumea!", "reiniciar": "Pornește într-o nouă călătorie", "categorias": {"capitales": "Țări și capitale", "idiomas": "Limbile lumii", "agua": "Râuri și oceane", "montes": "Lanțuri muntoase", "monumentos": "Monumente celebre", "cultura": "Cultură și curiozități"}}, "aprobar": 6, "continentes": [{"id": "europa", "nombre": "Europa", "emoji": "🏰", "color": "#2E6FB7", "preguntas": [{"cat": "capitales", "q": "Care este capitala Italiei?", "ops": ["Milano", "Roma", "Veneția", "Napoli"], "ok": 1, "dato": "Roma a fost centrul Imperiului Roman acum mai bine de 2 000 de ani."}, {"cat": "capitales", "q": "Ce țară are capitala la Madrid?", "ops": ["Portugalia", "Mexic", "Spania", "Argentina"], "ok": 2, "dato": "Madridul se află chiar în mijlocul Spaniei."}, {"cat": "idiomas", "q": "Ce limbă se vorbește în Austria?", "ops": ["Germana", "Franceza", "Austriaca", "Italiana"], "ok": 0, "dato": "Germana se vorbește în Germania, în Austria și într-o parte a Elveției."}, {"cat": "agua", "q": "Ce fluviu lung trece prin Viena, Budapesta și Belgrad?", "ops": ["Rinul", "Sena", "Tamisa", "Dunărea"], "ok": 3, "dato": "Dunărea traversează sau mărginește 10 țări înainte să ajungă în Marea Neagră."}, {"cat": "montes", "q": "Care este cel mai înalt lanț muntos din vestul Europei?", "ops": ["Alpii", "Pirineii", "Carpații", "Uralii"], "ok": 0, "dato": "Mont Blanc, din Alpi, are aproximativ 4 800 de metri înălțime."}, {"cat": "monumentos", "q": "În ce oraș se află Colosseumul?", "ops": ["Atena", "Paris", "Roma", "Londra"], "ok": 2, "dato": "Colosseumul a fost deschis acum aproape 2 000 de ani și avea loc pentru aproximativ 50 000 de oameni."}, {"cat": "monumentos", "q": "Ce turn celebru a fost construit la Paris în 1889?", "ops": ["Turnul înclinat", "Turnul Eiffel", "Big Ben", "Turnul CN"], "ok": 1, "dato": "Turnul Eiffel are aproximativ 330 de metri înălțime."}, {"cat": "cultura", "q": "Ce mare se află între Europa și Africa?", "ops": ["Marea Baltică", "Marea Nordului", "Marea Mediterană", "Marea Roșie"], "ok": 2, "dato": "Numele ei înseamnă „marea din mijlocul pământurilor”."}]}, {"id": "asia", "nombre": "Asia", "emoji": "🏯", "color": "#C4532E", "preguntas": [{"cat": "capitales", "q": "Care este capitala Japoniei?", "ops": ["Tokyo", "Kyoto", "Osaka", "Seul"], "ok": 0, "dato": "Tokyo este unul dintre cele mai mari orașe din lume."}, {"cat": "capitales", "q": "Ce țară are capitala la New Delhi?", "ops": ["Pakistan", "India", "Nepal", "Bangladesh"], "ok": 1, "dato": "India are mai mulți locuitori decât oricare altă țară din lume."}, {"cat": "idiomas", "q": "Ce limbă are cei mai mulți vorbitori nativi din lume?", "ops": ["Engleza", "Spaniola", "Hindi", "Chineza mandarină"], "ok": 3, "dato": "Aproape un miliard de oameni vorbesc chineza mandarină ca limbă maternă."}, {"cat": "agua", "q": "Care este cel mai lung fluviu din Asia?", "ops": ["Gange", "Mekong", "Yangtze", "Indus"], "ok": 2, "dato": "Fluviul Yangtze curge aproximativ 6 300 de kilometri prin China."}, {"cat": "montes", "q": "Ce lanț muntos are cel mai înalt vârf de pe Pământ?", "ops": ["Himalaya", "Anzii", "Alpii", "Munții Stâncoși"], "ok": 0, "dato": "Muntele Everest are aproximativ 8 850 de metri înălțime."}, {"cat": "monumentos", "q": "Ce zid lung a fost construit ca să apere China de atacuri?", "ops": ["Zidul lui Hadrian", "Marele Zid", "Zidul Berlinului", "Zidul de Vest"], "ok": 1, "dato": "Numeroasele lui porțiuni au, împreună, mii de kilometri lungime."}, {"cat": "monumentos", "q": "În ce țară se află Taj Mahal?", "ops": ["Iran", "Turcia", "India", "Egipt"], "ok": 2, "dato": "Este un mormânt din marmură albă construit în anii 1600."}, {"cat": "cultura", "q": "Care este cel mai mare continent de pe Pământ?", "ops": ["Africa", "Asia", "America de Nord", "Europa"], "ok": 1, "dato": "Asia acoperă aproximativ o treime din tot uscatul Pământului."}]}, {"id": "africa", "nombre": "Africa", "emoji": "🦒", "color": "#C9961A", "preguntas": [{"cat": "capitales", "q": "Care este capitala Egiptului?", "ops": ["Cairo", "Alexandria", "Luxor", "Tunis"], "ok": 0, "dato": "Cairo este unul dintre cele mai mari orașe din Africa."}, {"cat": "capitales", "q": "Ce țară are capitala la Nairobi?", "ops": ["Etiopia", "Tanzania", "Kenya", "Uganda"], "ok": 2, "dato": "Nairobi are, chiar lângă oraș, un parc național cu lei și girafe."}, {"cat": "idiomas", "q": "În ce parte a Africii se vorbește mult limba swahili?", "ops": ["În Africa de Est", "În Africa de Nord", "În Africa de Vest", "Doar în sudul Africii"], "ok": 0, "dato": "Milioane de oameni din Kenya, Tanzania și țările vecine vorbesc swahili."}, {"cat": "agua", "q": "Ce fluviu trece prin Egipt și se varsă în Marea Mediterană?", "ops": ["Congo", "Niger", "Zambezi", "Nilul"], "ok": 3, "dato": "Nilul este unul dintre cele mai lungi două fluvii din lume."}, {"cat": "montes", "q": "Care este cel mai înalt munte din Africa?", "ops": ["Muntele Kenya", "Kilimanjaro", "Munții Atlas", "Muntele Masă"], "ok": 1, "dato": "Kilimanjaro, din Tanzania, are aproximativ 5 900 de metri înălțime și zăpadă în vârf."}, {"cat": "monumentos", "q": "Unde se află Marile Piramide?", "ops": ["Giza, Egipt", "Timbuktu, Mali", "Roma, Italia", "Petra, Iordania"], "ok": 0, "dato": "Marea Piramidă a fost construită acum aproximativ 4 500 de ani."}, {"cat": "cultura", "q": "Care este cel mai mare deșert fierbinte din lume?", "ops": ["Gobi", "Kalahari", "Sahara", "Atacama"], "ok": 2, "dato": "Sahara acoperă o mare parte din nordul Africii."}, {"cat": "cultura", "q": "Ce cascadă celebră se află între Zambia și Zimbabwe?", "ops": ["Cascada Niagara", "Salto Ángel", "Cascada Victoria", "Cascadele Iguazú"], "ok": 2, "dato": "Numele ei local înseamnă „fumul care tună”."}]}, {"id": "norteamerica", "nombre": "America de Nord", "emoji": "🦅", "color": "#14897B", "preguntas": [{"cat": "capitales", "q": "Care este capitala Canadei?", "ops": ["Toronto", "Vancouver", "Montréal", "Ottawa"], "ok": 3, "dato": "Ottawa, nu Toronto, este capitala Canadei."}, {"cat": "capitales", "q": "Care este capitala Mexicului?", "ops": ["Cancún", "Ciudad de México", "Guadalajara", "Monterrey"], "ok": 1, "dato": "Orașul Ciudad de México a fost construit pe locul orașului aztec Tenochtitlan."}, {"cat": "idiomas", "q": "Care sunt cele două limbi oficiale ale Canadei?", "ops": ["Engleza și spaniola", "Engleza și franceza", "Franceza și spaniola", "Engleza și germana"], "ok": 1, "dato": "Cei mai mulți vorbitori de franceză din Canada locuiesc în Québec."}, {"cat": "agua", "q": "Ce fluviu mare curge spre sud prin Statele Unite până în Golful Mexic?", "ops": ["Mississippi", "Amazonul", "Colorado", "Hudson"], "ok": 0, "dato": "Împreună cu râul Missouri, formează unul dintre cele mai lungi sisteme de râuri din lume."}, {"cat": "montes", "q": "Ce lanț muntos se întinde de-a lungul vestului Canadei și al Statelor Unite?", "ops": ["Munții Apalași", "Anzii", "Munții Stâncoși", "Alpii"], "ok": 2, "dato": "Munții Stâncoși se întind pe aproximativ 4 800 de kilometri."}, {"cat": "monumentos", "q": "Ce canion uriaș a fost săpat de râul Colorado?", "ops": ["Marele Canion", "Canionul de Cupru", "Valea Morții", "Yosemite"], "ok": 0, "dato": "Pe alocuri, Marele Canion are o adâncime de peste 1,5 kilometri."}, {"cat": "monumentos", "q": "Ce statuie care ține o torță se află în portul New York?", "ops": ["Hristos Mântuitorul", "Statuia Libertății", "Gânditorul", "Mica Sirenă"], "ok": 1, "dato": "A fost un dar al Franței, în 1886."}, {"cat": "cultura", "q": "Ce cascade celebre se află între Canada și Statele Unite?", "ops": ["Cascada Victoria", "Salto Ángel", "Cascada Niagara", "Cascadele Iguazú"], "ok": 2, "dato": "Acolo cade în fiecare secundă o cantitate uriașă de apă."}]}, {"id": "sudamerica", "nombre": "America de Sud", "emoji": "🦜", "color": "#3E8E3E", "preguntas": [{"cat": "capitales", "q": "Care este capitala Braziliei?", "ops": ["Rio de Janeiro", "São Paulo", "Brasília", "Salvador"], "ok": 2, "dato": "Brasília a fost construită în doar câțiva ani și a devenit capitală în 1960."}, {"cat": "capitales", "q": "Ce țară are capitala la Buenos Aires?", "ops": ["Argentina", "Chile", "Uruguay", "Peru"], "ok": 0, "dato": "Buenos Aires se află pe malul fluviului Río de la Plata."}, {"cat": "idiomas", "q": "Ce limbă se vorbește în Brazilia?", "ops": ["Spaniola", "Braziliana", "Portugheza", "Engleza"], "ok": 2, "dato": "Brazilia este țara cu cei mai mulți vorbitori de portugheză din lume."}, {"cat": "agua", "q": "Ce fluviu duce cea mai multă apă din lume?", "ops": ["Nilul", "Amazonul", "Paraná", "Orinoco"], "ok": 1, "dato": "Amazonul duce mai multă apă decât următoarele câteva mari fluvii la un loc."}, {"cat": "montes", "q": "Care este cel mai lung lanț muntos de pe uscat?", "ops": ["Himalaya", "Munții Stâncoși", "Anzii", "Alpii"], "ok": 2, "dato": "Anzii se întind pe aproximativ 7 000 de kilometri de-a lungul vestului Americii de Sud."}, {"cat": "monumentos", "q": "Ce oraș incaș se află sus, în munții din Peru?", "ops": ["Machu Picchu", "Chichén Itzá", "Teotihuacan", "Tikal"], "ok": 0, "dato": "Machu Picchu a fost construit în anii 1400 și redescoperit de lume în 1911."}, {"cat": "monumentos", "q": "Ce statuie uriașă veghează asupra orașului Rio de Janeiro?", "ops": ["Statuia Libertății", "Hristos Mântuitorul", "Patria Mamă Cheamă", "Colosul"], "ok": 1, "dato": "Se află în vârful muntelui Corcovado."}, {"cat": "cultura", "q": "Care este cea mai înaltă cascadă din lume, aflată în Venezuela?", "ops": ["Cascadele Iguazú", "Cascada Niagara", "Salto Ángel", "Cascada Victoria"], "ok": 2, "dato": "Salto Ángel cade de la o înălțime de aproape 1 kilometru."}]}, {"id": "oceania", "nombre": "Oceania", "emoji": "🦘", "color": "#6B3FA0", "preguntas": [{"cat": "capitales", "q": "Care este capitala Australiei?", "ops": ["Sydney", "Melbourne", "Canberra", "Perth"], "ok": 2, "dato": "Canberra a fost construită ca să fie capitala, între Sydney și Melbourne."}, {"cat": "capitales", "q": "Care este capitala Noii Zeelande?", "ops": ["Auckland", "Wellington", "Christchurch", "Queenstown"], "ok": 1, "dato": "Wellington este unul dintre orașele cu cel mai mult vânt din lume."}, {"cat": "idiomas", "q": "Ce limbă a poporului maori este oficială în Noua Zeelandă?", "ops": ["Maori", "Hawaiiana", "Samoana", "Tongana"], "ok": 0, "dato": "Multe nume de locuri din Noua Zeelandă vin din limba maori."}, {"cat": "agua", "q": "Care este cel mai mare ocean de pe Pământ?", "ops": ["Atlanticul", "Oceanul Indian", "Oceanul Arctic", "Pacificul"], "ok": 3, "dato": "Oceanul Pacific este mai mare decât tot uscatul Pământului la un loc."}, {"cat": "montes", "q": "Ce munți se întind de-a lungul estului Australiei?", "ops": ["Marea Cumpănă a Apelor", "Anzii", "Alpii Sudici", "Munții Atlas"], "ok": 0, "dato": "Este cel mai lung lanț muntos din Australia."}, {"cat": "monumentos", "q": "Ce clădire celebră, cu „pânze” albe, se află la Sydney?", "ops": ["Opera", "Parlamentul", "Podul din port", "Sky Tower"], "ok": 0, "dato": "Opera din Sydney a fost inaugurată în 1973."}, {"cat": "cultura", "q": "Care este cel mai mare recif de corali din lume?", "ops": ["Reciful din Belize", "Reciful din Marea Roșie", "Marea Barieră de Corali", "Reciful din Maldive"], "ok": 2, "dato": "Marea Barieră de Corali, din Australia, poate fi văzută din spațiu."}, {"cat": "cultura", "q": "Ce animal își poartă puiul într-o pungă de pe burtă?", "ops": ["Koala și cangurul", "Pinguinul", "Emu", "Kiwi"], "ok": 0, "dato": "Animalele cu pungă se numesc marsupiale. Cele mai multe trăiesc în Australia."}]}]};const U=D.ui;const CL="travel-world-ro";
let est=JSON.parse(localStorage.getItem(CL)||"{}");const guardar=()=>localStorage.setItem(CL,JSON.stringify(est));
const $=s=>document.querySelector(s);const app=$("#app");
const f=(t,o)=>t.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
function pasaporte(){return `<div class="pas"><h2>🛂 ${U.pasaporte}</h2><div class="sellos">${D.continentes.map(c=>`<div class="sello ${est[c.id]?"ok":""}" style="border-color:${c.color};color:${c.color}" title="${c.nombre}">${c.emoji}</div>`).join("")}</div></div>`}
function inicio(){app.innerHTML=`<div style="font-size:54px">🌍✈️</div><h1>${U.titulo.replace(/(\S+)$/,"<span>$1</span>")}</h1><p class="lema">${U.lema}</p>${pasaporte()}<button class="btn" onclick="mapa()">${U.jugar}</button>`}
function mapa(){if(D.continentes.every(c=>est[c.id]))return fin();
 app.innerHTML=`${pasaporte()}<h2 style="margin:6px 0 12px">${U.elige}</h2><div class="mapa">${D.continentes.map((c,i)=>`<button class="cont" style="background:${c.color}" onclick="viaje(${i})"><b>${c.emoji}</b>${c.nombre}${est[c.id]?"<small>✓</small>":""}</button>`).join("")}</div>`}
let cur=null;
function viaje(i){const c=D.continentes[i];cur={c,i:0,bien:0,orden:c.preguntas.map((_,k)=>k).sort(()=>Math.random()-.5)};preg()}
function preg(){const c=cur.c,p=c.preguntas[cur.orden[cur.i]];
 app.innerHTML=`<div class="tarjeta"><span class="cat" style="background:${c.color}">${c.emoji} ${U.categorias[p.cat]}</span><span class="num">${f(U.pregunta,{n:cur.i+1,t:c.preguntas.length})}</span>
 <div class="q">${p.q}</div><div class="ops">${p.ops.map((o,j)=>`<button class="op" data-j="${j}">${o}</button>`).join("")}</div><div class="fb" id="fb"></div><div class="acc oculto" id="acc"><button class="btn" onclick="sig()">${U.siguiente} →</button></div></div>`;
 document.querySelectorAll(".op").forEach(b=>b.onclick=()=>resp(+b.dataset.j,p))}
function resp(j,p){document.querySelectorAll(".op").forEach(b=>{b.disabled=true;const k=+b.dataset.j;if(k===p.ok)b.classList.add("bien");else if(k===j)b.classList.add("mal")});
 const ok=j===p.ok;if(ok)cur.bien++;const fb=$("#fb");fb.style.display="block";
 fb.innerHTML=ok?`<b>✅ ${U.correcto}</b>${p.dato}`:`<b>❌ ${U.incorrecto} ${p.ops[p.ok]}</b>${p.dato}`;$("#acc").classList.remove("oculto")}
function sig(){cur.i++;if(cur.i<cur.c.preguntas.length)return preg();
 const c=cur.c,t=c.preguntas.length,gano=cur.bien>=D.aprobar;if(gano){est[c.id]=1;guardar()}
 app.innerHTML=`<div class="tarjeta res"><div class="big">${gano?c.emoji:"🧭"}</div><h2>${gano?U.sello:c.nombre}</h2><p>${f(U.puntos,{n:cur.bien,t})}</p>${gano?"":`<p>${f(U.sello_falta,{n:D.aprobar,t})}</p>`}
 <p>${gano?"":`<button class="btn" onclick="viaje(${D.continentes.indexOf(c)})">${U.reintentar}</button> `}<button class="btn ${gano?"":"gris"}" onclick="mapa()">${U.volver}</button></p></div>`}
function fin(){app.innerHTML=`${pasaporte()}<div class="tarjeta res"><div class="big">🏆</div><h2>${U.final_titulo}</h2><p>${U.final_texto}</p><button class="btn" onclick="est={};guardar();inicio()">${U.reiniciar}</button></div>`}
inicio();
</script></body></html>
